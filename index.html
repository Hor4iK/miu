<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>miu</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0c0c;
            font-family: 'Courier New', Courier, monospace;
            color: #f0f0f0;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        canvas {
            background-color: #121212;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
            touch-action: none;
        }
        /* Overlay UI styling */
        #event-banner {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.92);
            border: 2px solid #e0e0e0;
            padding: 8px 16px;
            font-size: 13px;
            text-align: center;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }
        #event-banner span {
            display: block;
            font-weight: bold;
            margin-bottom: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }
        .toast-msg {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #f0f0f0;
            color: #000;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            border: 2px solid #000;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="event-banner">
            <span id="event-title">СОБЫТИЕ</span>
            <div id="event-desc">Описание события...</div>
        </div>
        <div id="toast" class="toast-msg">Сообщение</div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const banner = document.getElementById('event-banner');
        const eventTitle = document.getElementById('event-title');
        const eventDesc = document.getElementById('event-desc');
        const toast = document.getElementById('toast');

        // Логическое разрешение кадра (портретный режим с фиксированными пропорциями)
        const GAME_WIDTH = 360;
        const GAME_HEIGHT = 640;
        let scale = 1;

        function resizeCanvas() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // Сохраняем пропорции 9:16
            let w = windowWidth;
            let h = windowWidth * (16 / 9);

            if (h > windowHeight) {
                h = windowHeight;
                w = windowHeight * (9 / 16);
            }

            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            scale = w / GAME_WIDTH;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // -------------------------------------------------------------
        // СОСТОЯНИЕ ИГРЫ И ХРАНИЛИЩЕ
        // -------------------------------------------------------------
        const DEFAULT_STATS = {
            hunger: 75,     // Голод (100 = сыт)
            mood: 80,       // Настроение
            energy: 70,     // Энергия/Усталость
            friendship: 50, // Дружба (растёт медленно, падает быстро)
            cleanliness: 85,// Чистота
            warmth: 80      // Тепло
        };

        let stats = { ...DEFAULT_STATS };

        function loadStats() {
            const saved = localStorage.getItem('cat_dragon_tamagotchi_save');
            if (saved) {
                try {
                    stats = Object.assign({}, DEFAULT_STATS, JSON.parse(saved));
                } catch(e) {
                    console.error('Ошибка загрузки сохранения', e);
                }
            }
        }

        function saveStats() {
            localStorage.setItem('cat_dragon_tamagotchi_save', JSON.stringify(stats));
        }

        loadStats();
        setInterval(saveStats, 5000);

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // -------------------------------------------------------------
        // ПОЗЫ И ОБЪЕКТЫ
        // -------------------------------------------------------------
        const world = {
            tableLegLeft: { x: 10, y: 180, w: 25, h: 420 },
            tableLegRight: { x: 325, y: 180, w: 25, h: 420 },
            window: { x: 220, y: 80, w: 100, h: 140 },
            box: { x: 30, y: 440, w: 110, h: 80 },
            stand: { x: 250, y: 430, w: 80, h: 90 },
            candle: { x: 270, y: 395, w: 18, h: 35, lit: true },
            mug: { x: 300, y: 405, w: 20, h: 25 },
            bowl: { x: 160, y: 520, w: 45, h: 22 },
            phone: { x: 20, y: 260, w: 30, h: 45, ringing: false },
            brush: { x: 55, y: 385, w: 28, h: 12 },
            toy: { x: 72, y: 525, w: 20, h: 12, hidden: false },
            lighter: { x: 305, y: 370, w: 14, h: 24 },
            tableStep: { x: 100, y: 395, w: 48, h: 25 },
            hiddenToySpot: null
        };

        const cat = {
            x: 140,
            y: 470,
            w: 60,
            h: 82,
            state: 'idle', // idle, walking, eating, grooming, playing, sleeping, stuck, window
            activity: 'Стоит',
            vx: 0,
            targetX: 140,
            targetY: 470,
            direction: 1,
            animTime: Math.random() * 10,
            taskUntil: 0,
            idleUntil: 0
        };

        const dragon = {
            x: 210,
            y: 465,
            w: 45,
            h: 60,
            state: 'idle', // idle, walking, eating, warming, sleeping, shocked
            activity: 'Стоит',
            vx: 0,
            vy: 0,
            targetX: 210,
            targetY: 465,
            direction: -1,
            animTime: Math.random() * 10,
            taskUntil: 0,
            idleUntil: 0,
            sparks: []
        };

        // Генерация искр для дракончика
        for (let i = 0; i < 8; i++) {
            dragon.sparks.push({
                x: (Math.random() - 0.5) * 40,
                y: (Math.random() - 0.5) * 40,
                speed: 0.5 + Math.random() * 1.2,
                angle: Math.random() * Math.PI * 2
            });
        }

        // -------------------------------------------------------------
        // -------------------------------------------------------------
        // ПОЛНАЯ СИСТЕМА ИВЕНТОВ
        // -------------------------------------------------------------
        let activeEvent = null;
        let eventTimer = 0;
        let eventState = {};
        let seeds = [];
        let parcel = null;
        let radialMenu = null;
        let postmanCooldown = performance.now() + 3 * 60 * 60 * 1000;
        let sneezeCooldown = performance.now() + 24 * 60 * 60 * 1000;
        let windowCooldown = 0;

        const EVENTS = {
            SPILLED_FOOD: 'spilled_food', POSTMAN: 'postman', CANDLE_BLOWN: 'candle_blown',
            SNUGGLE_SLEEP: 'snuggle_sleep', PHONE: 'phone', BLACKOUT: 'blackout',
            DRAGON_SNEEZE: 'dragon_sneeze', CAT_STUCK: 'cat_stuck', CAT_GROOMING: 'cat_grooming',
            ROLE_SWAP: 'role_swap', CAT_WINDOW: 'cat_window', CAT_TABLE: 'cat_table', CAT_TOY: 'cat_toy',
            DRAGON_WARM: 'dragon_warm'
        };

        function bannerEvent(title, desc) {
            banner.style.display = 'block';
            eventTitle.innerText = title;
            eventDesc.innerText = desc;
        }

        function triggerEvent(type, force=false) {
            if (activeEvent !== null && !force) return false;
            activeEvent = type; eventTimer = 0; eventState = {};
            cat.taskUntil = performance.now() + 999999;
            dragon.taskUntil = performance.now() + 999999;

            switch(type) {
                case EVENTS.SPILLED_FOOD:
                    bannerEvent('РАССЫПАННЫЙ КОРМ!', 'Кошка пытается помочь. Нажми на щётку, чтобы она сделала несколько взмахов.');
                    eventState.stage='brush'; eventState.brushSwings=0; eventState.deadline=performance.now()+12000;
                    cat.state='walking'; cat.targetX=70; cat.targetY=400; cat.activity='Идёт за щёткой';
                    break;
                case EVENTS.POSTMAN:
                    bannerEvent('ПОЧТАЛЬОН У ДВЕРИ!', 'Открой пакет. Если тянуть — герои начнут нервничать.');
                    parcel={x:150,y:385,w:55,h:38}; eventState.deadline=performance.now()+18000;
                    cat.activity='Скребётся у двери'; dragon.activity='Нервничает'; break;
                case EVENTS.CANDLE_BLOWN:
                    world.candle.lit=false; bannerEvent('СВЕЧА ПОГАСЛА!', 'Дракончик случайно задул свечу. Зажги её.');
                    eventState.deadline=performance.now()+12000; cat.state='walking'; cat.targetX=175; cat.targetY=470; cat.activity='Бежит к тебе'; break;
                case EVENTS.SNUGGLE_SLEEP:
                    bannerEvent('СОН В ОБНИМКУ', 'Они сами нашли уютный уголок. Тап — вздрагивают, ворчат и снова прижимаются.');
                    cat.state='sleeping'; dragon.state='sleeping'; cat.x=90; cat.y=500; dragon.x=112; dragon.y=500; eventState.tapped=false; eventState.deadline=performance.now()+15000; break;
                case EVENTS.PHONE:
                    bannerEvent('ТЕЛЕФОН ЗВОНИТ', 'Телефон вибрирует. Возьми трубку — или оставь их отвлекаться.');
                    world.phone.ringing=true; eventState.deadline=performance.now()+10000; break;
                case EVENTS.BLACKOUT:
                    bannerEvent('ОТКЛЮЧЕНИЕ СВЕТА В ЖК!', 'Почти ничего не видно. Ищи кружку, зажигалку или коробку. Свет вернётся позже.');
                    world.candle.lit=false; eventState.deadline=performance.now()+150000; eventState.found=false; break;
                case EVENTS.DRAGON_SNEEZE:
                    bannerEvent('ДРАКОНЧИК ЧИХНУЛ!', 'Уголок тлеет! Быстро нажми на кружку с водой.');
                    eventState.deadline=performance.now()+7000; eventState.fire=0; dragon.activity='В панике'; break;
                case EVENTS.CAT_STUCK:
                    bannerEvent('КОШКА ЗАСТРЯЛА!', 'Помоги: потяни край коробки или поднеси миску. Резкий тап обидит её.');
                    cat.state='stuck'; cat.activity='Застряла'; eventState.gentle=0; eventState.deadline=performance.now()+20000; break;
                case EVENTS.CAT_GROOMING:
                    bannerEvent('КОШКА УМЫВАЕТСЯ', 'Не мешай ей 10–15 секунд.'); cat.state='grooming'; cat.activity='Умывается'; eventState.deadline=performance.now()+12000; break;
                case EVENTS.ROLE_SWAP:
                    bannerEvent('ОБМЕН РОЛЯМИ!', 'Кошка дует огнём, дракончик в шоке. Просто наблюдай.');
                    dragon.state='shocked'; cat.activity='Дует огнём'; eventState.deadline=performance.now()+9000; break;
                case EVENTS.CAT_WINDOW:
                    bannerEvent('ОКНО В МИР', 'Подожди 5–10 секунд. Если нажать — она отвлечётся и уйдёт.');
                    cat.state='window'; cat.x=260; cat.y=320; cat.activity='Смотрит в окно'; eventState.deadline=performance.now()+8000; break;
                case EVENTS.CAT_TABLE:
                    bannerEvent('КОШКА ХОЧЕТ НА СТОЛ', 'Подтащи коробку к столу — она использует её как ступеньку.');
                    cat.state='walking'; cat.targetX=125; cat.targetY=410; cat.activity='Тянется к столу'; eventState.stepPlaced=false; eventState.deadline=performance.now()+18000; break;
                case EVENTS.CAT_TOY:
                    bannerEvent('КОШКА ПРЯЧЕТ ИГРУШКУ', 'Она спрятала игрушку. Найди её в комнате.');
                    world.toy.hidden=true; const spots=[{x:25,y:405},{x:75,y:505},{x:305,y:420}]; world.hiddenToySpot=spots[Math.floor(Math.random()*spots.length)]; eventState.deadline=performance.now()+20000; cat.activity='Прячет игрушку'; break;
                case EVENTS.DRAGON_WARM:
                    bannerEvent('ДРАКОНЧИК ГРЕЕТ КОШКУ', 'Он сам подлетел и укрыл её крылом. Просто замечай такие моменты.');
                    cat.activity='Греется'; dragon.activity='Греет кошку'; eventState.deadline=performance.now()+7000; break;
            }
            return true;
        }

        function finishEvent(message, friendship=0, mood=0, energy=0, hunger=0, cleanliness=0) {
            if(message) showToast(message);
            stats.friendship=Math.max(0,Math.min(100,stats.friendship+friendship));
            stats.mood=Math.max(0,Math.min(100,stats.mood+mood));
            stats.energy=Math.max(0,Math.min(100,stats.energy+energy));
            stats.hunger=Math.max(0,Math.min(100,stats.hunger+hunger));
            stats.cleanliness=Math.max(0,Math.min(100,stats.cleanliness+cleanliness));
            world.phone.ringing=false; world.toy.hidden=false; world.hiddenToySpot=null;
            activeEvent=null; eventState={}; parcel=null; seeds=[]; banner.style.display='none';
            cat.state='idle'; dragon.state='idle'; cat.activity='Осматривается'; dragon.activity='Осматривается';
            cat.taskUntil=performance.now()+1500; dragon.taskUntil=performance.now()+1500;
        }

        function updateEvents(now) {
            if(activeEvent===null) {
                // Пассивные и редкие события.
                if(stats.energy<18) triggerEvent(EVENTS.SNUGGLE_SLEEP);
                else if((stats.mood<35 || stats.warmth<35) && Math.random()<0.003) triggerEvent(EVENTS.DRAGON_WARM);
                else if(now-windowCooldown>0 && Math.random()<0.0008) { windowCooldown=now+24*60*60*1000; triggerEvent(EVENTS.CAT_WINDOW); }
                else if(now-postmanCooldown>0) { postmanCooldown=now+3*60*60*1000; triggerEvent(EVENTS.POSTMAN); }
                else if(now-sneezeCooldown>0) { sneezeCooldown=now+24*60*60*1000; triggerEvent(EVENTS.DRAGON_SNEEZE); }
                else if(Math.random()<0.0009) triggerEvent([EVENTS.SPILLED_FOOD,EVENTS.PHONE,EVENTS.CAT_GROOMING,EVENTS.CAT_STUCK,EVENTS.CAT_TABLE,EVENTS.CAT_TOY,EVENTS.CANDLE_BLOWN][Math.floor(Math.random()*7)]);
                return;
            }
            const deadline=eventState.deadline||0;
            if(deadline && now>deadline) {
                if(activeEvent===EVENTS.SPILLED_FOOD && eventState.stage==='seeds') { showToast('Зёрна исчезли. Кошка загрустила.'); finishEvent(null,0,-8,0,-2); }
                else if(activeEvent===EVENTS.CAT_GROOMING) finishEvent('Кошка закончила умываться. +Чистота +Настроение',0,5,0,0,10);
                else if(activeEvent===EVENTS.CAT_WINDOW) finishEvent('Мур-р... Какой красивый вечер.',0,8);
                else if(activeEvent===EVENTS.ROLE_SWAP) finishEvent('Герои хихикают. +Дружба',8,5);
                else if(activeEvent===EVENTS.SNUGGLE_SLEEP) finishEvent('Они снова прижались. +Силы +Дружба',6,4,18);
                else if(activeEvent===EVENTS.CANDLE_BLOWN) finishEvent('Кошка устала ждать. Настроение падает.',0,-10);
                else if(activeEvent===EVENTS.DRAGON_SNEEZE) finishEvent('Огонь погас сам. Герои расстроены.',0,-12);
                else if(activeEvent===EVENTS.PHONE) { world.phone.ringing=false; finishEvent('Автоответчик: «Ваш заказ готов…»',0,-3); }
                else if(activeEvent===EVENTS.CAT_TABLE) finishEvent('Кошка передумала лезть на стол.',0,-2);
                else if(activeEvent===EVENTS.CAT_TOY) { world.toy.hidden=false; finishEvent('Игрушку не нашли вовремя. Кошка вздыхает.',0,-4); }
                else if(activeEvent===EVENTS.BLACKOUT) { world.candle.lit=true; finishEvent('Свет вернулся. Они устали, но горды.',15,3,-5); }
                else if(activeEvent===EVENTS.POSTMAN) finishEvent('Почтальон ушёл. Кошка скребётся, дракончик нервничает.',0,-7);
                else if(activeEvent===EVENTS.CAT_STUCK) finishEvent('Кошка обиделась, но выбралась сама.',-3,-5);
                else if(activeEvent===EVENTS.DRAGON_WARM) finishEvent('Тепло и уютно.',3,4);
                return;
            }
            // Анимации и автоматические переходы.
            if(activeEvent===EVENTS.SPILLED_FOOD && eventState.stage==='brush') {
                if(now>eventState.deadline) { eventState.stage='seeds'; seeds=[]; for(let i=0;i<Math.floor(3+Math.random()*3);i++) seeds.push({x:80+Math.random()*210,y:440+Math.random()*100,r:5,vx:(Math.random()-.5)*45,vy:(Math.random()-.5)*35}); eventState.deadline=now+9000; bannerEvent('ПОЙМАЙ КОРМ!','Тапай по разлетающимся зёрнам.'); cat.state='idle'; cat.activity='Слишком тяжело!'; }
            } else if(activeEvent===EVENTS.SPILLED_FOOD && eventState.stage==='seeds') {
                seeds.forEach(z=>{z.x+=z.vx*0.016;z.y+=z.vy*0.016;z.vx*=0.995;z.vy*=0.995;});
            }
            if(activeEvent===EVENTS.DRAGON_SNEEZE) eventState.fire=Math.min(1,eventState.fire+0.01);
        }

        // Пассивное убывание статов
        setInterval(() => {
            stats.hunger = Math.max(0, stats.hunger - 0.15);
            stats.mood = Math.max(0, stats.mood - 0.12);
            stats.energy = Math.max(0, stats.energy - 0.10);
            stats.cleanliness = Math.max(0, stats.cleanliness - 0.08);
            stats.warmth = Math.max(0, stats.warmth - 0.06);

            // Логика дружбы: растёт медленно, если всё хорошо, падает быстро при ошибках/голоде
            if (stats.hunger > 50 && stats.mood > 50 && stats.warmth > 50) {
                stats.friendship = Math.min(100, stats.friendship + 0.05);
            } else if (stats.hunger < 20 || stats.mood < 20) {
                stats.friendship = Math.max(0, stats.friendship - 0.3);
            }

            // Авто-событие сна при высокой усталости
            if (stats.energy < 20 && activeEvent === null) {
                triggerEvent(EVENTS.SNUGGLE_SLEEP);
            }
        }, 1000);

        // -------------------------------------------------------------
        // ЖИВАЯ АВТОНОМНАЯ ЖИЗНЬ ПЕРСОНАЖЕЙ
        // -------------------------------------------------------------
        const CAT_TASKS = [
            { name: 'Идёт к окну', x: 260, y: 330, state: 'walking', duration: 4200 },
            { name: 'Проверяет коробку', x: 85, y: 475, state: 'walking', duration: 3800 },
            { name: 'Идёт к миске', x: 182, y: 500, state: 'walking', duration: 3500 },
            { name: 'Гуляет по комнате', x: 110, y: 475, state: 'walking', duration: 4500 },
            { name: 'Умывается', x: 120, y: 500, state: 'grooming', duration: 4200 },
            { name: 'Играет с хвостиком', x: 230, y: 490, state: 'playing', duration: 3600 }
        ];

        const DRAGON_TASKS = [
            { name: 'Греется у свечи', x: 275, y: 445, state: 'walking', duration: 4300 },
            { name: 'Проверяет миску', x: 190, y: 505, state: 'walking', duration: 3600 },
            { name: 'Летает по комнате', x: 250, y: 360, state: 'walking', duration: 3800 },
            { name: 'Возится с коробкой', x: 90, y: 480, state: 'walking', duration: 4000 },
            { name: 'Топчется на месте', x: 210, y: 470, state: 'walking', duration: 3000 }
        ];

        function chooseNextTask(now) {
            if (activeEvent !== null) return;

            // Если персонаж устал — сон становится приоритетом.
            if (stats.energy < 18) {
                cat.state = 'sleeping';
                cat.activity = 'Спит';
                cat.taskUntil = now + 9000;
                dragon.state = 'sleeping';
                dragon.activity = 'Спит';
                dragon.taskUntil = now + 9000;
                return;
            }

            const catTask = CAT_TASKS[Math.floor(Math.random() * CAT_TASKS.length)];
            cat.targetX = catTask.x;
            cat.targetY = catTask.y;
            cat.state = catTask.state;
            cat.activity = catTask.name;
            cat.taskUntil = now + catTask.duration;

            // Дракончик иногда выбирает свою задачу независимо.
            const dragonTask = DRAGON_TASKS[Math.floor(Math.random() * DRAGON_TASKS.length)];
            dragon.targetX = dragonTask.x;
            dragon.targetY = dragonTask.y;
            dragon.state = dragonTask.state;
            dragon.activity = dragonTask.name;
            dragon.taskUntil = now + dragonTask.duration;
        }

        function moveCharacter(ch, dt, speed) {
            const dx = ch.targetX - ch.x;
            const dy = ch.targetY - ch.y;
            const distance = Math.hypot(dx, dy);

            if (distance < 3) {
                if (ch.state === 'walking') ch.state = 'idle';
                return;
            }

            const step = Math.min(distance, speed * dt);
            ch.x += (dx / distance) * step;
            ch.y += (dy / distance) * step;

            if (Math.abs(dx) > 0.5) ch.direction = dx > 0 ? 1 : -1;
            ch.animTime += dt;

            // Не даём персонажам уходить за пределы игровой комнаты.
            ch.x = Math.max(45, Math.min(GAME_WIDTH - 45, ch.x));
            ch.y = Math.max(285, Math.min(GAME_HEIGHT - 70, ch.y));
        }

        function updateLivingWorld(now, dt) {
            if (activeEvent !== null) return;

            cat.animTime += dt;
            dragon.animTime += dt;

            if (now > cat.taskUntil && now > dragon.taskUntil) {
                chooseNextTask(now);
            }

            if (cat.state === 'walking') {
                moveCharacter(cat, dt, 38);
                if (Math.hypot(cat.targetX - cat.x, cat.targetY - cat.y) < 4) {
                    cat.state = 'idle';
                }
            } else if (cat.state === 'grooming') {
                // Небольшая анимация умывания.
                cat.animTime += dt * 1.5;
                if (now > cat.taskUntil) {
                    stats.cleanliness = Math.min(100, stats.cleanliness + 3);
                    stats.mood = Math.min(100, stats.mood + 1);
                }
            } else if (cat.state === 'playing') {
                cat.targetX = 140 + Math.sin(cat.animTime * 1.8) * 55;
                cat.targetY = 475 + Math.cos(cat.animTime * 1.4) * 18;
                cat.state = 'walking';
                cat.activity = 'Играет';
            }

            if (dragon.state === 'walking') {
                moveCharacter(dragon, dt, 31);
                if (Math.hypot(dragon.targetX - dragon.x, dragon.targetY - dragon.y) < 4) {
                    dragon.state = 'idle';
                }
            }

            // После окончания действия персонаж некоторое время просто живёт:
            // моргает, покачивается и выбирает новую активность.
            if (now > cat.taskUntil && cat.state !== 'sleeping') {
                cat.state = 'idle';
                cat.activity = 'Осматривается';
                cat.idleUntil = now + 1000 + Math.random() * 2500;
            }
            if (now > dragon.taskUntil && dragon.state !== 'sleeping') {
                dragon.state = 'idle';
                dragon.activity = 'Осматривается';
                dragon.idleUntil = now + 1000 + Math.random() * 2500;
            }

            if (cat.state === 'sleeping' && now > cat.taskUntil) {
                cat.state = 'idle';
                cat.activity = 'Просыпается';
                stats.energy = Math.min(100, stats.energy + 12);
            }
            if (dragon.state === 'sleeping' && now > dragon.taskUntil) {
                dragon.state = 'idle';
                dragon.activity = 'Просыпается';
            }
        }

        // -------------------------------------------------------------
        // ОТРИСОВКА В СТИЛЕ ЧЁРНО-БЕЛОРЙ ГРАВЮРЫ (ENGRAVING/HATCHING)
        // -------------------------------------------------------------
        function drawHatchingPattern(x, y, w, h, spacing = 6) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(x, y, w, h);
            ctx.clip();
            ctx.strokeStyle = '#444444';
            ctx.lineWidth = 1;
            for (let i = -h; i < w + h; i += spacing) {
                ctx.moveTo(x + i, y);
                ctx.lineTo(x + i + h, y + h);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawBackground() {
            // Задняя стена
            ctx.fillStyle = '#141414';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Штриховка пола (деревянные доски)
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 420, GAME_WIDTH, 220);
            
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1.5;
            for (let y = 420; y < GAME_HEIGHT; y += 25) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(GAME_WIDTH, y);
                ctx.stroke();
            }

            // Окно с луной в стиле гравюры
            const win = world.window;
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(win.x, win.y, win.w, win.h);
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 2;
            ctx.strokeRect(win.x, win.y, win.w, win.h);
            
            // Луна
            ctx.beginPath();
            ctx.arc(win.x + 70, win.y + 40, 18, 0, Math.PI * 2);
            ctx.fillStyle = '#e0e0e0';
            ctx.fill();
            // Лунные лучи (штриховка)
            drawHatchingPattern(win.x, win.y, win.w, win.h, 10);

            // Крупная ножка стола (масштаб: герои ниже стола)
            ctx.fillStyle = '#1c1c1c';
            ctx.fillRect(world.tableLegLeft.x, world.tableLegLeft.y, world.tableLegLeft.w, world.tableLegLeft.h);
            ctx.fillRect(world.tableLegRight.x, world.tableLegRight.y, world.tableLegRight.w, world.tableLegRight.h);
            ctx.strokeStyle = '#777777';
            ctx.strokeRect(world.tableLegLeft.x, world.tableLegLeft.y, world.tableLegLeft.w, world.tableLegLeft.h);
            ctx.strokeRect(world.tableLegRight.x, world.tableLegRight.y, world.tableLegRight.w, world.tableLegRight.h);

            // Коробка
            const b = world.box;
            ctx.fillStyle = '#222222';
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 2;
            ctx.strokeRect(b.x, b.y, b.w, b.h);
            drawHatchingPattern(b.x, b.y, b.w, b.h, 8);

            // Подставка и свеча
            const st = world.stand;
            ctx.fillStyle = '#181818';
            ctx.fillRect(st.x, st.y, st.w, st.h);
            ctx.strokeRect(st.x, st.y, st.w, st.h);

            const c = world.candle;
            ctx.fillStyle = '#e0e0e0';
            ctx.fillRect(c.x, c.y, c.w, c.h);
            if (c.lit) {
                // Огонек свечи
                ctx.beginPath();
                ctx.arc(c.x + c.w/2, c.y - 8, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                // Нимб света
                ctx.beginPath();
                ctx.arc(c.x + c.w/2, c.y - 8, 25, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.stroke();
            }

            // Кружка
            const m = world.mug;
            ctx.fillStyle = '#aaaaaa';
            ctx.fillRect(m.x, m.y, m.w, m.h);
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(m.x, m.y, m.w, m.h);

            // Миска для корма
            const bw = world.bowl;
            ctx.beginPath();
            ctx.ellipse(bw.x + bw.w/2, bw.y + bw.h/2, bw.w/2, bw.h/2, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#333333';
            ctx.fill();
            ctx.strokeStyle = '#e0e0e0';
            ctx.stroke();

            // Дополнительные предметы и сцены событий.
            const br=world.brush; ctx.fillStyle='#777'; ctx.fillRect(br.x,br.y,br.w,br.h); ctx.strokeStyle='#eee'; ctx.strokeRect(br.x,br.y,br.w,br.h);
            ctx.beginPath(); ctx.moveTo(br.x+2,br.y); ctx.lineTo(br.x-6,br.y-14); ctx.stroke();
            const toy=world.toy; if(!toy.hidden){ctx.fillStyle='#ddd';ctx.fillRect(toy.x,toy.y,toy.w,toy.h);ctx.strokeStyle='#111';ctx.strokeRect(toy.x,toy.y,toy.w,toy.h);}
            const lr=world.lighter; ctx.fillStyle='#777';ctx.fillRect(lr.x,lr.y,lr.w,lr.h);ctx.strokeStyle='#fff';ctx.strokeRect(lr.x,lr.y,lr.w,lr.h);
            const stp=world.tableStep; if(activeEvent===EVENTS.CAT_TABLE && eventState.stepPlaced){ctx.fillStyle='#333';ctx.fillRect(stp.x,stp.y,stp.w,stp.h);ctx.strokeStyle='#aaa';ctx.strokeRect(stp.x,stp.y,stp.w,stp.h);}
            if(activeEvent===EVENTS.CAT_TOY && world.hiddenToySpot){ctx.strokeStyle='#777';ctx.setLineDash([3,3]);ctx.strokeRect(world.hiddenToySpot.x-12,world.hiddenToySpot.y-12,44,36);ctx.setLineDash([]);}

            // Подсказки-кружочки на интерактивных объектах
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;
            (activeEvent === EVENTS.BLACKOUT ? [] : [c, m, bw, b, world.brush, world.toy, world.lighter]).forEach(obj => {
                ctx.beginPath();
                ctx.arc(obj.x + (obj.w||20)/2, obj.y + (obj.h||20)/2, 22, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        function drawCat() {
            ctx.save();
            ctx.translate(cat.x, cat.y);

            const moving = cat.state === 'walking';
            const walk = moving ? Math.sin(cat.animTime * 12) : 0;
            const bob = moving ? Math.abs(Math.sin(cat.animTime * 12)) * 1.5 : 0;
            const blink = Math.sin(cat.animTime * 1.7) > 0.94;

            if (cat.state === 'stuck') {
                // Из коробки торчат задние лапки и хвост.
                ctx.fillStyle = '#d0d0d0';
                ctx.beginPath();
                ctx.ellipse(0, 5, 24, 18, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-10, 14); ctx.lineTo(-14, 31);
                ctx.moveTo(10, 14); ctx.lineTo(14, 31);
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-14, 32, 4, 0, Math.PI * 2);
                ctx.arc(14, 32, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(5, 0);
                ctx.quadraticCurveTo(28, -18, 18, -38);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();
                return;
            }

            if (cat.state === 'sleeping') {
                ctx.fillStyle = '#e0e0e0';
                ctx.beginPath();
                ctx.ellipse(0, 10, 28, 20, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Лапки под мордочкой.
                ctx.fillStyle = '#f0f0f0';
                ctx.beginPath();
                ctx.ellipse(-11, 14, 7, 5, 0, 0, Math.PI * 2);
                ctx.ellipse(10, 14, 7, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-17, 0); ctx.lineTo(-24, -11); ctx.lineTo(-8, -5);
                ctx.moveTo(17, 0); ctx.lineTo(24, -11); ctx.lineTo(8, -5);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#000';
                ctx.font = '12px Courier New';
                ctx.fillText('z', 25, -12);
                ctx.fillText('z', 34, -22);
                ctx.restore();
                return;
            }

            // Ноги кошко-девочки: две полноценные конечности с лапками.
            ctx.strokeStyle = '#e8e8e8';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-10, 20);
            ctx.lineTo(-11 + walk * 5, 43);
            ctx.lineTo(-12 - walk * 5, 55);
            ctx.moveTo(10, 20);
            ctx.lineTo(11 - walk * 5, 43);
            ctx.lineTo(12 + walk * 5, 55);
            ctx.stroke();

            ctx.fillStyle = '#f5f5f5';
            ctx.beginPath();
            ctx.ellipse(-12 - walk * 5, 57, 7, 4, 0, 0, Math.PI * 2);
            ctx.ellipse(12 + walk * 5, 57, 7, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Тело.
            ctx.fillStyle = '#e0e0e0';
            ctx.beginPath();
            ctx.ellipse(0, bob, 22, 28, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Руки/передние лапы — двигаются при ходьбе.
            ctx.strokeStyle = '#ededed';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-18, -4);
            ctx.lineTo(-28, 10 + walk * 6);
            ctx.moveTo(18, -4);
            ctx.lineTo(28, 10 - walk * 6);
            ctx.stroke();

            // Маленькие лапки на концах рук.
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-29, 11 + walk * 6, 5, 0, Math.PI * 2);
            ctx.arc(29, 11 - walk * 6, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // Голова.
            ctx.beginPath();
            ctx.arc(0, -32 - bob, 22, 0, Math.PI * 2);
            ctx.fillStyle = '#f0f0f0';
            ctx.fill();
            ctx.stroke();

            // Ушки.
            ctx.beginPath();
            ctx.moveTo(-16, -45); ctx.lineTo(-24, -62); ctx.lineTo(-6, -50);
            ctx.moveTo(16, -45); ctx.lineTo(24, -62); ctx.lineTo(6, -50);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.stroke();

            // Глаза.
            ctx.fillStyle = '#0a0a0a';
            if (blink) {
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-12, -34); ctx.lineTo(-4, -34);
                ctx.moveTo(4, -34); ctx.lineTo(12, -34);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.ellipse(-8, -34, 5, 8, 0, 0, Math.PI * 2);
                ctx.ellipse(8, -34, 5, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-6, -36, 2, 0, Math.PI * 2);
                ctx.arc(10, -36, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Усики.
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-12, -28); ctx.lineTo(-28, -30);
            ctx.moveTo(-12, -25); ctx.lineTo(-26, -23);
            ctx.moveTo(12, -28); ctx.lineTo(28, -30);
            ctx.moveTo(12, -25); ctx.lineTo(26, -23);
            ctx.stroke();

            // Хвост — слегка машет.
            ctx.beginPath();
            ctx.moveTo(15, 10);
            ctx.quadraticCurveTo(35, 2 + walk * 3, 30 + walk * 3, -20);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.restore();
        }

        function drawDragon() {
            ctx.save();
            ctx.translate(dragon.x, dragon.y);

            const moving = dragon.state === 'walking';
            const walk = moving ? Math.sin(dragon.animTime * 13) : 0;
            const flap = Math.sin(dragon.animTime * 9) * (moving ? 3 : 1.5);

            if (dragon.state === 'sleeping') {
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.ellipse(0, 10, 20, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                ctx.fillStyle = '#888';
                ctx.beginPath();
                ctx.ellipse(-9, 16, 7, 4, 0, 0, Math.PI * 2);
                ctx.ellipse(9, 16, 7, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                return;
            }

            // Тело.
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.moveTo(-15, 20);
            ctx.lineTo(-12, -15);
            ctx.lineTo(0, -30);
            ctx.lineTo(12, -15);
            ctx.lineTo(15, 20);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Лапки/ножки дракончика.
            ctx.strokeStyle = '#777';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-8, 15); ctx.lineTo(-10 - walk * 4, 31);
            ctx.moveTo(8, 15); ctx.lineTo(10 + walk * 4, 31);
            ctx.stroke();
            ctx.fillStyle = '#aaa';
            ctx.beginPath();
            ctx.arc(-10 - walk * 4, 32, 4, 0, Math.PI * 2);
            ctx.arc(10 + walk * 4, 32, 4, 0, Math.PI * 2);
            ctx.fill();

            // Крылья.
            ctx.beginPath();
            ctx.moveTo(-12, -5);
            ctx.lineTo(-28, -18 - flap);
            ctx.lineTo(-15, 10);
            ctx.moveTo(12, -5);
            ctx.lineTo(28, -18 + flap);
            ctx.lineTo(15, 10);
            ctx.fillStyle = '#333';
            ctx.fill();
            ctx.stroke();

            // Рожки.
            ctx.beginPath();
            ctx.moveTo(-5, -28); ctx.lineTo(-10, -38); ctx.lineTo(-2, -30);
            ctx.moveTo(5, -28); ctx.lineTo(10, -38); ctx.lineTo(2, -30);
            ctx.fillStyle = '#fff';
            ctx.fill();

            // Глаза.
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-5, -20, 3, 0, Math.PI * 2);
            ctx.arc(5, -20, 3, 0, Math.PI * 2);
            ctx.fill();

            // Передние лапки.
            ctx.strokeStyle = '#777';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(-11, -2); ctx.lineTo(-23, 8 + walk * 4);
            ctx.moveTo(11, -2); ctx.lineTo(23, 8 - walk * 4);
            ctx.stroke();
            ctx.fillStyle = '#bbb';
            ctx.beginPath();
            ctx.arc(-24, 9 + walk * 4, 4, 0, Math.PI * 2);
            ctx.arc(24, 9 - walk * 4, 4, 0, Math.PI * 2);
            ctx.fill();

            // Искры.
            dragon.sparks.forEach(s => {
                s.x += Math.cos(s.angle) * s.speed;
                s.y += Math.sin(s.angle) * s.speed;
                if (Math.abs(s.x) > 30 || Math.abs(s.y) > 30) {
                    s.x = (Math.random() - 0.5) * 10;
                    s.y = (Math.random() - 0.5) * 10;
                }
                ctx.fillStyle = '#fff';
                ctx.fillRect(s.x, s.y, 2, 2);
            });

            ctx.restore();
        }

        function drawActivityLabel(x, y, text) {
            ctx.save();
            ctx.font = '8px Courier New';
            ctx.textAlign = 'center';
            const width = Math.max(52, ctx.measureText(text).width + 10);
            ctx.fillStyle = 'rgba(10,10,10,0.85)';
            ctx.fillRect(x - width / 2, y - 10, width, 13);
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            ctx.strokeRect(x - width / 2, y - 10, width, 13);
            ctx.fillStyle = '#eee';
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function drawUI() {
            // Верхняя панель полосок статов с текстовой текстурой штриховки
            const statsList = [
                { name: 'Голод', val: stats.hunger },
                { name: 'Настроение', val: stats.mood },
                { name: 'Энергия', val: stats.energy },
                { name: 'Дружба', val: stats.friendship },
                { name: 'Чистота', val: stats.cleanliness },
                { name: 'Тепло', val: stats.warmth }
            ];

            const barW = 100;
            const barH = 10;

            statsList.forEach((st, idx) => {
                const col = idx % 2;
                const row = Math.floor(idx / 2);
                const x = 15 + col * 170;
                const y = 12 + row * 20;

                ctx.fillStyle = '#ffffff';
                ctx.font = '10px Courier New';
                ctx.fillText(`${st.name}:`, x, y + 8);

                // Рамка полоски
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.strokeRect(x + 60, y, barW, barH);

                // Заполнение полоски (штриховка)
                const fillW = (Math.max(0, Math.min(100, st.val)) / 100) * barW;
                ctx.fillStyle = '#e0e0e0';
                ctx.fillRect(x + 60, y, fillW, barH);
            });

            drawActivityLabel(cat.x, cat.y - 68, cat.activity);
            drawActivityLabel(dragon.x, dragon.y - 45, dragon.activity);

            // Эффект темной комнаты (Отключение света / свеча погасла)
            if (activeEvent === EVENTS.BLACKOUT || !world.candle.lit) {
                ctx.fillStyle = 'rgba(5, 5, 5, 0.92)';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                // Искры дракончика слегка освещают вокруг
                const grad = ctx.createRadialGradient(dragon.x, dragon.y, 5, dragon.x, dragon.y, 70);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(dragon.x, dragon.y, 70, 0, Math.PI * 2);
                ctx.fill();
            }

            // Дракончик чихнул (уголок горит)
            if (activeEvent === EVENTS.DRAGON_SNEEZE) {
                ctx.fillStyle = 'rgba(255, 50, 50, 0.25)';
                ctx.fillRect(GAME_WIDTH - 80, GAME_HEIGHT - 80, 80, 80);
                drawHatchingPattern(GAME_WIDTH - 80, GAME_HEIGHT - 80, 80, 80, 5);
            }

            // Посылки почтальона
            if (parcel) {
                ctx.fillStyle = '#888888';
                ctx.fillRect(parcel.x, parcel.y, parcel.w, parcel.h);
                ctx.strokeStyle = '#ffffff';
                ctx.strokeRect(parcel.x, parcel.y, parcel.w, parcel.h);
                ctx.fillStyle = '#ffffff';
                ctx.font = '9px Courier New';
                ctx.fillText('ПОЧТА', parcel.x + 4, parcel.y + 20);
            }

            // Зёрна рассыпанного корма
            seeds.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.strokeStyle = '#000000';
                ctx.stroke();
            });

            // Кольцевое круговое меню действий (Radial Menu)
            if (radialMenu) {
                ctx.save();
                const count = radialMenu.options.length;
                const radius = 45;
                radialMenu.options.forEach((opt, idx) => {
                    const angle = (idx / count) * Math.PI * 2 - Math.PI / 2;
                    const ox = radialMenu.x + Math.cos(angle) * radius;
                    const oy = radialMenu.y + Math.sin(angle) * radius;

                    ctx.beginPath();
                    ctx.arc(ox, oy, 18, 0, Math.PI * 2);
                    ctx.fillStyle = '#111111';
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '9px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText(opt.label, ox, oy + 3);
                });
                ctx.restore();
            }

            // Атмосфера событий.
            if(activeEvent===EVENTS.DRAGON_SNEEZE){ctx.fillStyle='rgba(120,20,20,0.22)';ctx.fillRect(GAME_WIDTH-90,GAME_HEIGHT-110,90,110);}
            if(activeEvent===EVENTS.BLACKOUT){
                ctx.fillStyle='rgba(0,0,0,0.94)';ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);
                const glow=ctx.createRadialGradient(dragon.x,dragon.y,4,dragon.x,dragon.y,80);glow.addColorStop(0,'rgba(255,255,255,.35)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(dragon.x,dragon.y,80,0,Math.PI*2);ctx.fill();
                ctx.strokeStyle='#777';ctx.lineWidth=1;ctx.beginPath();ctx.arc(world.mug.x+10,world.mug.y+12,18,0,Math.PI*2);ctx.stroke();
            }
            if(activeEvent===EVENTS.PHONE && world.phone.ringing){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(world.phone.x+15,world.phone.y+22,22+Math.sin(performance.now()/80)*4,0,Math.PI*2);ctx.stroke();}
            if(activeEvent===EVENTS.ROLE_SWAP){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cat.x+25,cat.y-20);ctx.lineTo(cat.x+60,cat.y-30);ctx.stroke();ctx.fillStyle='#fff';ctx.font='16px Courier New';ctx.fillText('FWOOSH!',cat.x+35,cat.y-35);}
        }

        // -------------------------------------------------------------
        // ОБРАБОТКА ВВОДА (КЛИКИ И ТАПЫ)
        // -------------------------------------------------------------
        canvas.addEventListener('pointerdown', (e) => {
            const rect=canvas.getBoundingClientRect();
            const clickX=(e.clientX-rect.left)/scale, clickY=(e.clientY-rect.top)/scale;
            const now=performance.now();

            if(radialMenu){
                const count=radialMenu.options.length,radius=45; let clicked=false;
                radialMenu.options.forEach((opt,idx)=>{const a=idx/count*Math.PI*2-Math.PI/2,ox=radialMenu.x+Math.cos(a)*radius,oy=radialMenu.y+Math.sin(a)*radius;if(Math.hypot(clickX-ox,clickY-oy)<20){opt.action();clicked=true;}});
                radialMenu=null;if(clicked)return;
            }

            if(activeEvent===EVENTS.SPILLED_FOOD){
                if(eventState.stage==='brush' && clickX>35&&clickX<105&&clickY>360&&clickY<420){eventState.brushSwings++;cat.activity=eventState.brushSwings<3?'Машет щёткой':'Слишком тяжело!';if(eventState.brushSwings>=3){eventState.stage='seeds';seeds=[];for(let i=0;i<Math.floor(3+Math.random()*3);i++)seeds.push({x:80+Math.random()*210,y:440+Math.random()*100,r:5,vx:(Math.random()-.5)*55,vy:(Math.random()-.5)*40});eventState.deadline=now+9000;bannerEvent('ПОЙМАЙ КОРМ!','Тапай по 3–5 зёрнам.');}return;}
                if(eventState.stage==='seeds'){for(let i=seeds.length-1;i>=0;i--){if(Math.hypot(clickX-seeds[i].x,clickY-seeds[i].y)<18){seeds.splice(i,1);showToast('Поймано!');break;}}if(!seeds.length){finishEvent('Всё поймано! Радость! +Дружба',8,10,0,-6);return;}return;}
            }
            if(activeEvent===EVENTS.POSTMAN && parcel && clickX>=parcel.x&&clickX<=parcel.x+parcel.w&&clickY>=parcel.y&&clickY<=parcel.y+parcel.h){finishEvent('Корм и маленькая игрушка! Герои счастливы.',10,12,0,20);return;}
            if(activeEvent===EVENTS.CANDLE_BLOWN && !world.candle.lit){const c=world.candle;if(clickX>c.x-15&&clickX<c.x+c.w+15&&clickY>c.y-15&&clickY<c.y+c.h+15){world.candle.lit=true;finishEvent('Свет вернулся. Кошка прижалась.',5,8);return;}}
            if(activeEvent===EVENTS.PHONE && clickX>world.phone.x-15&&clickX<world.phone.x+45&&clickY>world.phone.y-15&&clickY<world.phone.y+65){finishEvent('Автоответчик: «Ваш заказ готов…»',2,2);return;}
            if(activeEvent===EVENTS.SNUGGLE_SLEEP){eventState.tapped=true;cat.activity='Вздрагивает';dragon.activity='Вздрагивает';setTimeout(()=>{if(activeEvent===EVENTS.SNUGGLE_SLEEP){cat.activity='Снова прижалась';dragon.activity='Снова прижался';}},400);return;}
            if(activeEvent===EVENTS.BLACKOUT){const hit=(x,y,w,h)=>clickX>x-12&&clickX<x+w+12&&clickY>y-12&&clickY<y+h+12;if(hit(world.mug.x,world.mug.y,world.mug.w,world.mug.h)||hit(world.lighter.x,world.lighter.y,world.lighter.w,world.lighter.h)||hit(world.box.x,world.box.y,world.box.w,world.box.h)){eventState.found=true;finishEvent('Нашли предмет! Свет возвращается позже.');return;}return;}
            if(activeEvent===EVENTS.DRAGON_SNEEZE){const m=world.mug;if(clickX>m.x-18&&clickX<m.x+m.w+18&&clickY>m.y-18&&clickY<m.y+m.h+18){finishEvent('Кошка тушит уголок! Герои смеются.',10,6);return;}return;}
            if(activeEvent===EVENTS.CAT_STUCK){const b=world.box;if(clickX>b.x&&clickX<b.x+b.w&&clickY>b.y&&clickY<b.y+b.h){eventState.gentle++;if(eventState.gentle>=2){finishEvent('Кошка выбралась. +Дружба',7,3);return;}showToast('Ещё чуть-чуть, аккуратно!');return;}if(Math.hypot(clickX-world.bowl.x-world.bowl.w/2,clickY-world.bowl.y-world.bowl.h/2)<35){finishEvent('Кошка увидела миску и выбралась!',8,5,0,8);return;}return;}
            if(activeEvent===EVENTS.CAT_GROOMING){finishEvent('Ты не мешал. Кошка довольна!',0,5,0,0,10);return;}
            if(activeEvent===EVENTS.CAT_WINDOW){finishEvent('Она отвлеклась и ушла.',0,-2);return;}
            if(activeEvent===EVENTS.CAT_TABLE){if(clickX>85&&clickX<165&&clickY>375&&clickY<430){eventState.stepPlaced=true;cat.targetX=125;cat.targetY=390;cat.state='walking';cat.activity='Забирается на ступеньку';setTimeout(()=>{if(activeEvent===EVENTS.CAT_TABLE)finishEvent('Получилось! Кошка довольна.',5,5);},2500);return;}return;}
            if(activeEvent===EVENTS.CAT_TOY && world.hiddenToySpot){if(clickX>world.hiddenToySpot.x-15&&clickX<world.hiddenToySpot.x+35&&clickY>world.hiddenToySpot.y-15&&clickY<world.hiddenToySpot.y+35){finishEvent('Игрушка найдена! +Дружба и маленькая награда.',8,8,0,5);return;}return;}
            if(activeEvent===EVENTS.ROLE_SWAP||activeEvent===EVENTS.DRAGON_WARM)return;

            if(Math.hypot(clickX-cat.x,clickY-cat.y)<35){radialMenu={x:cat.x,y:cat.y-20,options:[
                {label:'Гладить',action:()=>{stats.mood=Math.min(100,stats.mood+10);cat.activity='Мурчит';cat.taskUntil=now+1800;showToast('Кошка мурчит!');}},
                {label:'Играть',action:()=>{stats.mood=Math.min(100,stats.mood+15);stats.energy=Math.max(0,stats.energy-10);cat.activity='Играет';cat.taskUntil=now+2200;showToast('Весёлая игра!');}},
                {label:'Помыть',action:()=>{stats.cleanliness=Math.min(100,stats.cleanliness+25);cat.activity='Умывается';cat.taskUntil=now+2200;showToast('Кошка чистая!');}}]};return;}
            if(Math.hypot(clickX-dragon.x,clickY-dragon.y)<30){radialMenu={x:dragon.x,y:dragon.y-20,options:[{label:'Погреть',action:()=>{stats.warmth=Math.min(100,stats.warmth+20);showToast('Дракончик греет лапки!');}},{label:'Угостить',action:()=>{stats.hunger=Math.min(100,stats.hunger+10);showToast('Дракончик доволен!');}}]};return;}
            const bw=world.bowl;if(Math.hypot(clickX-(bw.x+bw.w/2),clickY-(bw.y+bw.h/2))<30){stats.hunger=Math.min(100,stats.hunger+30);showToast('Миска заполнена кормом!');return;}
        });

        // -------------------------------------------------------------
        // ИГРОВОЙ ЦИКЛ
        // -------------------------------------------------------------
        let lastFrame = performance.now();

        function gameLoop(now) {
            const dt = Math.min(0.05, (now - lastFrame) / 1000);
            lastFrame = now;

            updateLivingWorld(now, dt);
            updateEvents(now);

            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            drawBackground();
            drawCat();
            drawDragon();
            drawUI();

            requestAnimationFrame(gameLoop);
        }

        // Персонажи начинают жить сразу после загрузки.
        chooseNextTask(performance.now());
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
