<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>miu</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: monospace; }
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { background: #e0e0e0; display: block; }
    
    /* HUD UI */
    .hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
    .stat-row { display: flex; align-items: center; justify-content: space-between; color: #000; font-size: 10px; font-weight: bold; background: rgba(255,255,255,0.85); padding: 4px 8px; border: 1px solid #000; }
    .stat-bar-bg { width: 50%; height: 8px; border: 1px solid #000; background: #fff; }
    .stat-bar-fill { height: 100%; background: #000; width: 50%; transition: width 0.2s; }
    
    /* Event Banner */
    #event-banner { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); background: #000; color: #fff; padding: 8px 16px; font-size: 11px; border: 1px solid #fff; display: none; text-align: center; }

    /* Controls */
    .controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
    .action-btn { background: #fff; color: #000; border: 2px solid #000; padding: 12px 18px; font-weight: bold; font-family: monospace; cursor: pointer; border-radius: 4px; box-shadow: 3px 3px 0 #000; }
    .action-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  
  <div class="hud">
    <div class="stat-row"><span>ГОЛОД</span><div class="stat-bar-bg"><div id="bar-hunger" class="stat-bar-fill"></div></div></div>
    <div class="stat-row"><span>НАСТРОЕНИЕ</span><div class="stat-bar-bg"><div id="bar-mood" class="stat-bar-fill"></div></div></div>
    <div class="stat-row"><span>УСТАЛОСТЬ</span><div class="stat-bar-bg"><div id="bar-fatigue" class="stat-bar-fill"></div></div></div>
    <div class="stat-row"><span>ДРУЖБА</span><div class="stat-bar-bg"><div id="bar-friendship" class="stat-bar-fill"></div></div></div>
  </div>

  <div id="event-banner">Ивент</div>

  <div class="controls">
    <button class="action-btn" onclick="game.interact()">[ Позвать / Погладить ]</button>
    <button class="action-btn" onclick="game.toggleCandle()">[ Свеча ]</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.ready(); }

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function initCanvasSize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
initCanvasSize();
window.addEventListener('resize', initCanvasSize);

class Game {
  constructor() {
    this.stats = { hunger: 60, mood: 80, fatigue: 20, friendship: 50 };
    this.eventState = 'NONE';
    this.candleLit = true;
    this.time = 0; // Счётчик кадров для анимации
    
    // Позиции и физика персонажей
    this.floorY = canvas.height * 0.72;
    
    this.cat = {
      x: canvas.width * 0.6,
      y: this.floorY,
      targetX: canvas.width * 0.6,
      vx: 0,
      isBlinking: false
    };

    this.dragon = {
      x: canvas.width * 0.3,
      y: this.floorY,
      targetX: canvas.width * 0.3,
      vx: 0
    };

    this.bindEvents();
    this.loop();
  }

  bindEvents() {
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // Клик по Canvas заставляет персонажей идти к точке клика
      if (clickY > canvas.height * 0.4) {
        this.cat.targetX = clickX;
        this.dragon.targetX = clickX - 50; // Дракончик идет рядом
      }
    });
  }

  interact() {
    // Подзвать персонажей в центр
    this.cat.targetX = canvas.width * 0.5;
    this.dragon.targetX = canvas.width * 0.35;
    this.stats.mood = Math.min(100, this.stats.mood + 10);
    this.stats.friendship = Math.min(100, this.stats.friendship + 2);
  }

  toggleCandle() {
    this.candleLit = !this.candleLit;
  }

  update() {
    this.time += 0.05; // Перемотка фазы анимации

    // Логика перемещения (плавный подход к targetX)
    const updateCharPos = (char) => {
      const dx = char.targetX - char.x;
      if (Math.abs(dx) > 2) {
        char.vx = Math.sign(dx) * 2;
        char.x += char.vx;
      } else {
        char.vx = 0;
      }
    };

    updateCharPos(this.cat);
    updateCharPos(this.dragon);

    // Моргание кошки (случайный тайминг)
    if (Math.random() < 0.01) {
      this.cat.isBlinking = true;
      setTimeout(() => this.cat.isBlinking = false, 150);
    }

    // Изменение параметров
    this.stats.hunger = Math.max(0, this.stats.hunger - 0.01);
    this.stats.mood = Math.max(0, this.stats.mood - 0.005);

    // Обновление баров
    document.getElementById('bar-hunger').style.width = this.stats.hunger + '%';
    document.getElementById('bar-mood').style.width = this.stats.mood + '%';
    document.getElementById('bar-fatigue').style.width = this.stats.fatigue + '%';
    document.getElementById('bar-friendship').style.width = this.stats.friendship + '%';
  }

  // --- ВЕКТОРНАЯ ОТРИСОВКА ПЕРСОНАЖЕЙ (ГРАВЮРНЫЙ СТИЛЬ) ---

  drawHatching(x, y, w, h, step = 6) {
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = -h; i < w; i += step) {
      ctx.moveTo(x + i, y);
      ctx.lineTo(x + i + h, y + h);
    }
    ctx.stroke();
  }

  drawCat() {
    ctx.save();
    
    // Анимация шага и дыхания
    const walkBounce = Math.abs(Math.sin(this.time * 3)) * (this.cat.vx !== 0 ? 6 : 0);
    const breathe = Math.sin(this.time * 1.5) * 1.5;
    
    ctx.translate(this.cat.x, this.cat.y - walkBounce);

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2.5;

    // 1. Хвост (анимированный изгиб)
    const tailWiggle = Math.sin(this.time * 2) * 10;
    ctx.beginPath();
    ctx.moveTo(15, -20);
    ctx.quadraticCurveTo(35 + tailWiggle, -40, 25 + tailWiggle, -60);
    ctx.stroke();

    // 2. Платьице / Тело
    ctx.beginPath();
    ctx.moveTo(-12, -35);
    ctx.lineTo(12, -35);
    ctx.lineTo(20, -10 + breathe);
    ctx.lineTo(-20, -10 + breathe);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Штриховка на платье
    ctx.save();
    ctx.clip();
    this.drawHatching(-20, -35, 40, 30, 5);
    ctx.restore();

    // 3. Ножки
    ctx.beginPath();
    ctx.rect(-10, -10 + breathe, 6, 10 + walkBounce);
    ctx.rect(4, -10 + breathe, 6, 10 - walkBounce);
    ctx.fill(); ctx.stroke();

    // 4. Голова с пышной причёской
    ctx.beginPath();
    ctx.arc(0, -50 + breathe, 22, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // Кошачьи Ушки
    // Левое
    ctx.beginPath();
    ctx.moveTo(-15, -62 + breathe);
    ctx.lineTo(-24, -82 + breathe);
    ctx.lineTo(-5, -70 + breathe);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Правое
    ctx.beginPath();
    ctx.moveTo(15, -62 + breathe);
    ctx.lineTo(24, -82 + breathe);
    ctx.lineTo(5, -70 + breathe);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // 5. Лицо (Глаза, Носик, Усики)
    ctx.fillStyle = '#000';
    if (!this.cat.isBlinking) {
      // Большие глаза
      ctx.beginPath();
      ctx.ellipse(-8, -52 + breathe, 4, 6, 0, 0, Math.PI * 2);
      ctx.ellipse(8, -52 + breathe, 4, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Блик в глазах
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-9, -54 + breathe, 1.5, 0, Math.PI * 2);
      ctx.arc(7, -54 + breathe, 1.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Моргание (щелочки)
      ctx.beginPath();
      ctx.moveTo(-12, -52 + breathe); ctx.lineTo(-4, -52 + breathe);
      ctx.moveTo(4, -52 + breathe); ctx.lineTo(12, -52 + breathe);
      ctx.stroke();
    }

    // Усики
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-18, -48 + breathe); ctx.lineTo(-28, -52 + breathe);
    ctx.moveTo(-18, -45 + breathe); ctx.lineTo(-27, -45 + breathe);
    ctx.moveTo(18, -48 + breathe); ctx.lineTo(28, -52 + breathe);
    ctx.moveTo(18, -45 + breathe); ctx.lineTo(27, -45 + breathe);
    ctx.stroke();

    ctx.restore();
  }

  drawDragon() {
    ctx.save();
    
    const walkBounce = Math.abs(Math.sin(this.time * 3)) * (this.dragon.vx !== 0 ? 4 : 0);
    const breathe = Math.sin(this.time * 2 + 1) * 1.5;

    ctx.translate(this.dragon.x, this.dragon.y - walkBounce);

    ctx.fillStyle = '#1a1a1a'; // Тёмно-серый/чёрный силуэт
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;

    // 1. Крылышки (хлопают)
    const wingFlap = Math.sin(this.time * 3) * 0.2;
    ctx.save();
    ctx.scale(1, 1 + wingFlap);
    ctx.beginPath();
    ctx.moveTo(-8, -25);
    ctx.lineTo(-28, -40);
    ctx.lineTo(-18, -20);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();

    // 2. Угловатое тело
    ctx.beginPath();
    ctx.moveTo(0, -35 + breathe);
    ctx.lineTo(15, -15);
    ctx.lineTo(10, 0);
    ctx.lineTo(-12, 0);
    ctx.lineTo(-15, -20);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // 3. Рожки
    ctx.beginPath();
    ctx.moveTo(-5, -33 + breathe); ctx.lineTo(-10, -45 + breathe); ctx.lineTo(-2, -36 + breathe);
    ctx.moveTo(2, -33 + breathe); ctx.lineTo(8, -45 + breathe); ctx.lineTo(5, -36 + breathe);
    ctx.fill(); ctx.stroke();

    // 4. Светящийся хвост (Огонёк)
    ctx.beginPath();
    ctx.moveTo(-10, -5);
    ctx.quadraticCurveTo(-25, -10, -28 + Math.sin(this.time * 4) * 3, -18);
    ctx.strokeStyle = '#000';
    ctx.stroke();

    // Огонёк-фонарик на кончике хвоста
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.beginPath();
    ctx.arc(-28 + Math.sin(this.time * 4) * 3, -18, 5 + Math.random() * 2, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // 5. Глаз
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(5, -26 + breathe, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  drawEnvironment() {
    // Фон и Темнота
    ctx.fillStyle = this.candleLit ? '#e0e0e0' : '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (this.candleLit) {
      // Задняя комната
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;

      // Линия пола
      ctx.beginPath();
      ctx.moveTo(0, this.floorY);
      ctx.lineTo(canvas.width, this.floorY);
      ctx.stroke();

      // Штриховка пола
      this.drawHatching(0, this.floorY, canvas.width, canvas.height - this.floorY, 15);

      // Крупный "взрослый" стол
      ctx.fillStyle = '#fff';
      ctx.fillRect(canvas.width * 0.7, canvas.height * 0.25, 12, this.floorY - canvas.height * 0.25);
      ctx.strokeRect(canvas.width * 0.7, canvas.height * 0.25, 12, this.floorY - canvas.height * 0.25);

      // Коробка на полу
      ctx.fillRect(20, this.floorY - 45, 70, 45);
      ctx.strokeRect(20, this.floorY - 45, 70, 45);
      this.drawHatching(20, this.floorY - 45, 70, 45, 6);

      // Свеча на переднем плане
      ctx.fillRect(canvas.width * 0.1, canvas.height * 0.3, 10, 25);
      ctx.strokeRect(canvas.width * 0.1, canvas.height * 0.3, 10, 25);
      
      // Пламя свечи
      ctx.beginPath();
      ctx.arc(canvas.width * 0.1 + 5, canvas.height * 0.3 - 5, 4 + Math.sin(this.time * 5), 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    } else {
      // Ночной режим: снижен контраст, остаётся лишь свет огонька дракона
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.beginPath();
      ctx.arc(this.dragon.x - 28, this.dragon.y - 18, 90, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Окружение
    this.drawEnvironment();

    // 2. Персонажи (полностью векторные)
    this.drawCat();
    this.drawDragon();
  }

  loop() {
    this.update();
    this.draw();
    requestAnimationFrame(() => this.loop());
  }
}

const game = new Game();
</script>
</body>
</html>
